name: Deploy

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:   # allow manual runs from the Actions UI

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ---------------------------------------------------------------------------
  # Build & publish container image to GHCR
  # ---------------------------------------------------------------------------
  docker:
    name: Build & push image
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write

    outputs:
      version: ${{ steps.meta.outputs.version }}
      is_release: ${{ steps.is_release.outputs.value }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          lfs: true

      - name: Determine version & release flag
        id: is_release
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "value=true" >> $GITHUB_OUTPUT
          else
            echo "value=false" >> $GITHUB_OUTPUT
          fi

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # On a v* tag: 1.2.3, 1.2, latest. On a branch push: branch name +
          # sha-<short>. `latest` only moves when a tag ships.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=ref,event=branch
            type=sha,prefix=sha-,format=short

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # `version` from metadata is "1.2.3" for tag v1.2.3, branch name
          # otherwise. Baked into the binary via Dockerfile ARG.
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache
          cache-to:   type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache,mode=max

  # ---------------------------------------------------------------------------
  # Deploy to Oracle Linux server via SSH + Podman
  # ---------------------------------------------------------------------------
  deploy:
    name: Deploy to Oracle Linux
    needs: docker
    runs-on: ubuntu-latest
    # Only tag pushes deploy to production. Pushes to main just build the
    # branch image so it can be smoke-tested before tagging.
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 129.146.57.206
          username: opc
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            set -euo pipefail

            # ---- auth -------------------------------------------------------
            echo '${{ secrets.GITHUB_TOKEN }}' | \
              podman login ghcr.io -u '${{ github.actor }}' --password-stdin

            # ---- resolve image tag ------------------------------------------
            # Deploy only runs on v* tags, so VERSION is always the semver
            # (e.g. "1.2.3") emitted by docker/metadata-action.
            VERSION="${{ needs.docker.outputs.version }}"
            IMAGE="ghcr.io/${{ github.repository }}:${VERSION}"
            echo "Deploying ${IMAGE}"

            # Reclaim disk from prior deploys before pulling. Each lite-inference
            # image is multi-GB; without this, /var fills up after ~20 releases.
            # --volumes is omitted so litert-hf-cache (model files) is preserved.
            podman image prune -a -f || true

            podman pull "${IMAGE}"

            # ---- model volume (persisted across restarts) -------------------
            podman volume create litert-hf-cache 2>/dev/null || true

            # ---- replace container ------------------------------------------
            # Host port 8080 is taken by oscar-emr; publish litert on 8090.
            podman rm -f litert-server 2>/dev/null || true

            echo "Starting litert-server ..."
            podman run -d \
              --name litert-server \
              --pull never \
              -p 8090:8080 \
              -v litert-hf-cache:/data/huggingface:z \
              -e HF_TOKEN=${{ secrets.HF_TOKEN }} \
              -e HF_HOME=/data/huggingface \
              --restart unless-stopped \
              "${IMAGE}" \
              --backend cpu \
              --port 8080 \
              --startup_load partial \
              --embed_repo litert-community/embeddinggemma-300m \
              --embed_seq_len 512

            # ---- verify -----------------------------------------------------
            # Give the container a moment to settle before inspecting state.
            sleep 5

            echo ""
            echo "=== Deployment verification ==="
            podman ps -a --filter name=litert-server \
              --format "table {{.Names}}\t{{.Image}}\t{{.Status}}\t{{.Ports}}"

            STATE=$(podman inspect -f '{{.State.Status}}' litert-server 2>/dev/null || echo missing)
            echo "Container state: ${STATE}"

            if [ "${STATE}" != "running" ]; then
              echo ""
              echo "=== Container is not running — last 200 log lines ==="
              podman logs --tail 200 litert-server || true
              exit 1
            fi

            echo ""
            echo "=== Health check ==="
            if HEALTH=$(curl -sf http://localhost:8090/health); then
              echo "OK: ${HEALTH}"
              echo "Deployed version: ${VERSION}"
            else
              echo "(not ready yet — model may still be loading)"
            fi
