name: Deploy

on:
  push:
    branches: [main]
    tags:
      - "v*"

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ---------------------------------------------------------------------------
  # Build & publish container image to GHCR
  # ---------------------------------------------------------------------------
  docker:
    name: Build & push image
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write

    outputs:
      version: ${{ steps.meta.outputs.version }}
      is_release: ${{ steps.is_release.outputs.value }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          lfs: true

      - name: Determine version & release flag
        id: is_release
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "value=true" >> $GITHUB_OUTPUT
          else
            echo "value=false" >> $GITHUB_OUTPUT
          fi

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=branch
            type=sha,prefix=sha-,format=short

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache
          cache-to:   type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache,mode=max

  # ---------------------------------------------------------------------------
  # Deploy to Oracle Linux server via SSH + Podman
  # ---------------------------------------------------------------------------
  deploy:
    name: Deploy to Oracle Linux
    needs: docker
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main'

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 129.146.57.206
          username: opc
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            set -euo pipefail

            # ---- auth -------------------------------------------------------
            echo '${{ secrets.GITHUB_TOKEN }}' | \
              podman login ghcr.io -u '${{ github.actor }}' --password-stdin

            # ---- resolve image tag ------------------------------------------
            VERSION="${{ needs.docker.outputs.version }}"
            if [ -z "$VERSION" ]; then
              VERSION="main"
            fi
            IMAGE="ghcr.io/${{ github.repository }}:${VERSION}"
            echo "Pulling ${IMAGE} ..."
            podman pull "${IMAGE}"

            # ---- model volume (persisted across restarts) -------------------
            podman volume create litert-hf-cache 2>/dev/null || true

            # ---- replace container ------------------------------------------
            podman stop  litert-server 2>/dev/null || true
            podman rm    litert-server 2>/dev/null || true

            echo "Starting litert-server ..."
            podman run -d \
              --name litert-server \
              --pull never \
              -p 8080:8080 \
              -v litert-hf-cache:/data/huggingface:z \
              -e HF_TOKEN=${{ secrets.HF_TOKEN }} \
              -e HF_HOME=/data/huggingface \
              --restart unless-stopped \
              "${IMAGE}" \
              --backend cpu \
              --port 8080

            # ---- verify -----------------------------------------------------
            echo ""
            echo "=== Deployment verification ==="
            podman ps --format "table {{.Names}}\t{{.Image}}\t{{.Status}}" \
              | grep litert-server

            echo ""
            echo "=== Health check ==="
            sleep 3
            curl -sf http://localhost:8080/health && echo " OK" || echo " (not ready yet — model may still be loading)"
